[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zana-cli"
version = "0.1.0"
description = "A developer productivity CLI that scaffolds projects, generates conventional commit messages with Claude API, and audits repos."
readme = "README.md"
authors = [{ name = "Christopher Njihia", email = "crnjihia@gmail.com" }]
license = "MIT"
requires-python = ">=3.11"
keywords = ["cli", "productivity", "scaffold", "git", "conventional-commits", "audit", "anthropic", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "httpx>=0.24.0",
    "anthropic>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-jinja2",
]

[project.scripts]
zana = "zana.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zana = ["templates/**/*", "templates/**/.*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
